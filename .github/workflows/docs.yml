name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish before starting the next one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for accurate page timestamps

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          environments: dev

      - name: Build documentation site
        run: pixi run docs-build
        env:
          GITHUB_TOKEN: ${{ github.token }}  # for the changelog page (from GitHub Releases)

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write  # to deploy to GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
