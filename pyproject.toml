[project]
name = "autostorage"
version = "0.0.21"
readme = "README.md"  # the PyPI page
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Andreas V. Copan", email = "avcopan@uga.edu"},
    {name = "Troy N. Smith", email = "troy.smith@uga.edu"},
]
dependencies = [
    "autogeom>=0.0.1",
    "sqlmodel>=0.0.31",
]
requires-python = ">= 3.13"

[project.urls]
Repository = "https://github.com/avcopan/autostorage"
Documentation = "https://avcopan.github.io/autostorage/"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

# Ruff configurations
[tool.ruff]
extend-exclude = [".claude"]  # vendored agent skills

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # conflict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "PLR2004"]  # assert, magic values
"examples/**.py" = ["S101", "T201", "INP001"]  # assert, print, no __init__.py

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/test/bin/python"

[tool.ty.src]
include = [
    "src",
    "tests",
]

# Import-linter configurations
[tool.importlinter]
root_package = "autostorage"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Module Layering"
type = "layers"
layers = [
    "autostorage.database",
    "autostorage.events",
    "autostorage.query",
    "autostorage.property | autostorage.identity",
    "autostorage.models",
    "autostorage.types",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=autostorage",
    "--cov-report=term-missing",
    "--cov-report=html",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["autostorage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
